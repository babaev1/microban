[project]
name = "microban"
version = "0.0.2"
description = "Microban project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "onnxruntime>=1.26.0",
    "placo>=0.9.23",
    "pollen_bmi088_imu_library==1.0.0rc1",
    "rustypot>=1.4.2",
    # zubr_link.py's serial link to the STM32 motor controller (/dev/ttyS2) — needed by
    # src/main.py (via zubr_robot_controller.py) on the real robot, so it must be a base
    # dependency: `make run` deploys with `uv sync --frozen` (no `--group sim`), which
    # would otherwise leave it uninstalled and main.py would fail at import with
    # "No module named 'serial'". See docs/dev/hw_stream.md.
    "pyserial>=3.5",
]

[dependency-groups]
sim = [
    # bam is NOT a dependency here: PyPI's better-actuator-models has no SKS2401 support
    # (the Roki4's actual servos) and neither does any branch of github.com/Rhoban/bam.
    # A subset that does is vendored at vendor/bam/ instead — see vendor/bam/README.md
    # and docs/dev/sim_training_parity.md. `make sim`/`make sim-master` put it on
    # PYTHONPATH directly; it needs no install step.
    "mujoco>=3.8.1",
    # Not imported by anything in this project directly — vendor/bam/bam/message.py
    # (reached from mujoco_controller.py's `from bam.model import load_model`) imports
    # it unconditionally for terminal color output. vendor/bam is deliberately NOT a
    # uv dependency itself (see the note above), so nothing otherwise declares this;
    # it used to be pulled in only by accident, as a transitive dependency of the
    # since-removed `better-actuator-models` package, which silently broke `make
    # sim`/`sim-master` the moment that accidental path stopped resolving it.
    "colorama",
]

[tool.uv]
override-dependencies = [
    "numpy>=2.3",
]
