[project]
name = "microban"
version = "0.0.2"
description = "Microban project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "onnxruntime>=1.26.0",
    "placo>=0.9.23",
    "pollen_bmi088_imu_library==1.0.0rc1",
    "rustypot>=1.4.2",
]

[dependency-groups]
sim = [
    # bam is NOT a dependency here: PyPI's better-actuator-models has no SKS2401 support
    # (the Roki4's actual servos) and neither does any branch of github.com/Rhoban/bam.
    # A subset that does is vendored at vendor/bam/ instead — see vendor/bam/README.md
    # and docs/dev/sim_training_parity.md. `make sim`/`make sim-master` put it on
    # PYTHONPATH directly; it needs no install step.
    "mujoco>=3.8.1",
    # Only used by src/hw_state_stream.py (real robot -> remote MuJoCo viewer, see
    # docs/dev/hw_stream.md) to talk to the STM32 motor controller over /dev/ttyS2. It
    # lives in this group rather than the base dependencies because that script is
    # meaningless without mujoco too — both come in together via `--group sim`.
    "pyserial>=3.5",
]

[tool.uv]
override-dependencies = [
    "numpy>=2.3",
]
